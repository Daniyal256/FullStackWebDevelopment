<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: #333;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      padding: 15px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-align: right;
      font-size: 32px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      background: #555;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:hover {
      background: #666;
    }

    .operator {
      background: #ff9500;
    }

    .operator:hover {
      background: #ffad33;
    }

    .clear {
      background: #d9534f;
    }

    .equal {
      background: #28a745;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="display">
      0
    </div>

    <div class="buttons">
      <button class="clear">AC</button>
      <button>+/-</button>
      <button>%</button>
      <button class="operator">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="equal">=</button>
    </div>

  </div>

</body>
</html>
