<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEase — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --p: #ea580c;
    --pl: #fff7ed;
    --nav-border: #fed7aa;
    --body-bg: #fafaf9;
    --card-border: #e7e5e4;
    --footer-bg: #f5f5f4;
  }
  body { background: var(--body-bg); font-family: system-ui, -apple-system, sans-serif; color: #1c1917; }
  .btn-p, a.btn-p, button.btn-p, label.btn-p { background-color: var(--p) !important; background: var(--p) !important; border-color: var(--p) !important; color: #fff !important; border-radius: 8px; font-weight: 600; text-decoration: none; }
  .btn-p:hover, a.btn-p:hover, button.btn-p:hover, label.btn-p:hover, .btn-p:focus, a.btn-p:focus, button.btn-p:focus, label.btn-p:focus { background-color: #c2410c !important; background: #c2410c !important; border-color: #c2410c !important; color: #fff !important; text-decoration: none; }
  .form-control:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
</style>
</head>
<body>

<nav class="py-3 bg-white shadow-sm" style="border-bottom:1px solid var(--nav-border);">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="text-dark text-decoration-none fw-bold fs-5 d-flex align-items-center gap-2">
      <i class="bi bi-bag-heart-fill" style="color:var(--p);"></i> ShopEase
    </a>
    <a href="signup.html" class="text-secondary text-decoration-none small">
      Don't have an account? <span class="fw-semibold" style="color:var(--p);">Sign Up</span>
    </a>
  </div>
</nav>

<main>
<div class="row g-0" style="min-height:calc(100vh - 120px);">
  <div class="col-lg-6 d-none d-lg-flex position-relative overflow-hidden" style="background:#292524;">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=900&q=80" alt="Modern Store" class="position-absolute w-100 h-100" style="object-fit:cover;opacity:.4;">
    <div class="position-relative p-5 d-flex flex-column justify-content-end text-white" style="z-index:1;">
      <div class="mb-3 d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3" style="background:rgba(234,88,12,.4);width:fit-content;">
        <i class="bi bi-hand-thumbs-up"></i>
        <span class="small fw-semibold">Trusted by 50,000+ Pakistanis</span>
      </div>
      <h2 class="fw-bold mb-2" style="font-size:2rem;line-height:1.25;">Welcome Back!<br>Continue Shopping</h2>
      <p class="text-white-50 small mb-0">Access your cart, orders and exclusive deals.</p>
    </div>
  </div>

  <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
    <div class="w-100" style="max-width:380px;">
      <h4 class="fw-bold mb-1">Login</h4>
      <p class="text-secondary small mb-4">Sign in to your ShopEase account</p>
      <form action="index.html">
        <div class="mb-3">
          <label class="form-label fw-semibold small" for="em">Email or Phone</label>
          <input type="text" id="em" class="form-control" placeholder="ali@example.com or 03xx-xxxxxxx" required>
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold small" for="pw">Password</label>
          <input type="password" id="pw" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="text-end mb-3"><a href="#" class="small text-decoration-none fw-semibold" style="color:var(--p);">Forgot password?</a></div>
        <button type="submit" class="btn btn-p w-100 py-2 fw-semibold mb-3">Login</button>
      </form>
      <p class="text-center text-secondary small mb-0">Don't have an account? <a href="signup.html" class="fw-semibold text-decoration-none" style="color:var(--p);">Register</a></p>
    </div>
  </div>
</div>
</main>

<footer style="background:var(--footer-bg);border-top:1px solid var(--card-border);" class="py-3 text-secondary">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 small">
    <div>&copy; 2026 ShopEase Pakistan. All rights reserved.</div>
    <div><a href="index.html" class="text-secondary text-decoration-none me-3">Home</a><a href="cart.html" class="text-secondary text-decoration-none">Cart</a></div>
  </div>
</footer>

</body>
</html>
